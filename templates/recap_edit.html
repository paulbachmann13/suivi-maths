{% extends "base.html" %}{% block body %}
<h1>Fiche recap : {{ chap.nom }}</h1>
<p class="muted">Mise en forme : <code>## Titre</code>, <code>- puce</code>, <code>&gt; encadré (définition, propriété)</code>, <code>**gras**</code>. Formules en LaTeX entre <code>$...$</code>.</p>
<form method="post" class="form">
<textarea name="contenu" id="contenu" rows="22">{{ contenu }}</textarea>
<button class="btn">Enregistrer</button> <a href="{{ url_for('recap_detail', chap_id=chap.id) }}">annuler</a></form>
{% endblock %}
