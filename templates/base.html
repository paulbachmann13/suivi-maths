<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Suivi maths{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>
function renderMath(root){ if(window.renderMathInElement) renderMathInElement(root||document.body,{delimiters:[
 {left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false}); }
window.addEventListener('load',()=>renderMath());
</script></head>
<body>
<nav><b>Suivi maths</b>
<a href="{{ url_for('index') }}">Tableau de bord</a>
<a href="{{ url_for('recaps') }}">Fiches recap</a>
<a href="{{ url_for('exos') }}">Exercices</a>
<a href="{{ url_for('fiches') }}">Fiches</a>
<a href="{{ url_for('notions') }}">Notions</a></nav>
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main></body></html>
